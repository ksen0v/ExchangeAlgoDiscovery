name: desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach the build to a release on v* tags

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-dev.txt

      - name: Install
        run: pip install -r requirements-desktop.txt -r requirements-dev.txt pyinstaller

      - name: Tests
        run: python -m pytest -q

      - name: Build
        run: pyinstaller --noconfirm desktop/radar.spec

      - name: Smoke test (demo exchanges, 40 s)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:RADAR_HOME = "$pwd\selftest"
          $p = Start-Process dist\ManipulationRadar\ManipulationRadar.exe -ArgumentList "--demo", "--selftest", "40" -PassThru -Wait
          Get-Content selftest\selftest.json -ErrorAction SilentlyContinue
          Get-Content selftest\radar.log -Tail 40 -ErrorAction SilentlyContinue
          exit $p.ExitCode

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\ManipulationRadar -DestinationPath ManipulationRadar-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ManipulationRadar-windows
          path: ManipulationRadar-windows.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: selftest/
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ManipulationRadar-windows.zip
