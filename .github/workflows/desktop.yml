name: desktop

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # publish verified installers as GitHub Releases

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: ${{ !contains(github.event.head_commit.message, '[docs-only]') }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-dev.txt
            .github/windows-build-constraints.txt

      - name: Install
        run: pip install -c .github/windows-build-constraints.txt -r requirements-desktop.txt -r requirements-dev.txt pyinstaller==6.22.3

      - name: Set build version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.prepare_version

      - name: Tests
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/workspace.test.cjs

      - name: Build
        env:
          PYTHONHASHSEED: "1"
          SOURCE_DATE_EPOCH: "1577836800"
        run: |
          pyinstaller --noconfirm desktop/radar.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pyinstaller --noconfirm desktop/launcher.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble versioned app and changed-file packages
        id: files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.file_release

      - name: Smoke test (demo exchanges, 40 s)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:RADAR_HOME = "$pwd\selftest"
          $p = Start-Process dist\ManipulationRadar\ManipulationRadar.exe -ArgumentList "--demo", "--selftest", "40" -PassThru -Wait
          Get-Content selftest\selftest.json -ErrorAction SilentlyContinue
          Get-Content selftest\radar.log -Tail 40 -ErrorAction SilentlyContinue
          exit $p.ExitCode

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\ManipulationRadar -DestinationPath ManipulationRadar-windows.zip

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup is missing from the runner image' }
          & $compiler '/DAppVersion=${{ steps.version.outputs.version }}' desktop\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed: $LASTEXITCODE" }
          python -m scripts.update_manifest
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create update manifest' }

      - name: Verify install and upgrade preserve user data
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $pwd 'dist\ManipulationRadar-Setup.exe'
          $installRoot = Join-Path $pwd 'installer-test'
          $env:RADAR_HOME = Join-Path $pwd 'installer-selftest'
          $p = Start-Process -FilePath $installer -WindowStyle Hidden -PassThru -Wait -ArgumentList '/VERYSILENT', '/SP-', '/NORESTART', '/NORUN=1', "/DIR=`"$installRoot`""
          if ($p.ExitCode -ne 0) { throw "First installation failed: $($p.ExitCode)" }
          New-Item -ItemType Directory -Force -Path $env:RADAR_HOME | Out-Null
          $prefsFile = Join-Path $env:RADAR_HOME 'desktop.json'
          [System.IO.File]::WriteAllText($prefsFile, '{"overlay":{"min_usd":1234}}')
          $prefsHash = (Get-FileHash -LiteralPath $prefsFile -Algorithm SHA256).Hash
          $envFile = Join-Path $env:RADAR_HOME '.env'
          [System.IO.File]::WriteAllText($envFile, "# Existing user configuration`n")
          $envHash = (Get-FileHash -LiteralPath $envFile -Algorithm SHA256).Hash
          $oldApp = Start-Process -FilePath (Join-Path $installRoot 'ManipulationRadar.exe') -WindowStyle Hidden -PassThru -ArgumentList '--demo', '--selftest', '20'
          # The updater waits for the old app to exit before touching its files. NORUN avoids
          # starting a real exchange session after this CI-only upgrade.
          $p = Start-Process -FilePath $installer -WindowStyle Hidden -PassThru -Wait -ArgumentList '/VERYSILENT', '/SP-', '/NORESTART', '/NORUN=1', '/RADARUPDATE=1', "/RADARPID=$($oldApp.Id)", "/DIR=`"$installRoot`""
          if ($p.ExitCode -ne 0) { throw "Upgrade failed: $($p.ExitCode)" }
          $oldApp.WaitForExit()
          if ($oldApp.ExitCode -ne 0) { throw "Installed application smoke test failed: $($oldApp.ExitCode)" }
          if ((Get-FileHash -LiteralPath $prefsFile -Algorithm SHA256).Hash -ne $prefsHash) { throw 'User preferences changed during upgrade' }
          if ((Get-FileHash -LiteralPath $envFile -Algorithm SHA256).Hash -ne $envHash) { throw 'User .env changed during upgrade' }
          $result = Get-Content -LiteralPath (Join-Path $env:RADAR_HOME 'selftest.json') -Raw | ConvertFrom-Json
          if (-not $result.ok -or $result.version -ne '${{ steps.version.outputs.version }}') { throw 'Installed build version or startup check failed' }

      - name: Verify changed-file update of a running installed app
        timeout-minutes: 5
        run: python -m scripts.verify_file_updates

      - uses: actions/upload-artifact@v4
        with:
          name: ManipulationRadar-windows
          path: ManipulationRadar-windows.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: ManipulationRadar-installer
          path: |
            dist/ManipulationRadar-Setup.exe
            dist/update.json
            dist/files.json
            dist/size-report.json
            dist/update-parts/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: |
            selftest/
            installer-selftest/
            file-update-selftest/
          if-no-files-found: ignore

      - name: Prepare release description
        run: python -m scripts.release_notes '${{ steps.version.outputs.version }}'

      - name: Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/minimal-radar' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Manipulation Radar ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          body_path: dist/release-notes.md
          files: |
            dist/ManipulationRadar-Setup.exe
            dist/update.json
            dist/files.json
            dist/size-report.json
            ${{ steps.files.outputs.parts }}

      - name: Start public release history at 1.0.0
        if: success() && steps.version.outputs.version == '1.0.0' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/minimal-radar' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.retire_legacy_releases
